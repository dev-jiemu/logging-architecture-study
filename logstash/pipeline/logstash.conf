input {
  # HTTP로 로그 받음
  http {
    port => 5044
    codec => json
  }
}

filter {
  # 타임스탬프 추가
  if ![timestamp] {
    mutate {
      add_field => { "timestamp" => "%{@timestamp}" }
    }
  }
  
  # 로그 레벨에 따라 태그 추가
  if [level] == "ERROR" {
    mutate {
      add_tag => [ "error" ]
    }
  }
}

output {
  # Elasticsearch로 전송
  elasticsearch {
    hosts => ["elasticsearch:9200"]
    index => "logs-%{+YYYY.MM.dd}"  # 날짜별로 인덱스 생성
  }
  
  # 디버깅용
  stdout {
    codec => rubydebug
  }
}
