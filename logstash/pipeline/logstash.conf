input {
  # Kafka에서 로그 소비
  # 기존: HTTP로 직접 수신 → 트래픽 스파이크 시 드롭 발생
  # 변경: Kafka가 버퍼 역할 → Logstash는 소화 가능한 속도로만 처리
  kafka {
    bootstrap_servers => "kafka:9092"
    topics => ["logs"]
    group_id => "logstash-consumer"
    codec => json
    consumer_threads => 4       # 파티션 수에 맞춰 조정 (기본 파티션 1개면 1로도 충분)
    auto_offset_reset => "latest"
  }
}

filter {
  # 타임스탬프 추가
  if ![timestamp] {
    mutate {
      add_field => { "timestamp" => "%{@timestamp}" }
    }
  }
  
  # 로그 레벨에 따라 태그 추가
  if [level] == "ERROR" {
    mutate {
      add_tag => [ "error" ]
    }
  }
}

output {
  # Elasticsearch로 전송
  elasticsearch {
    hosts => ["elasticsearch:9200"]
    index => "logs-%{+YYYY.MM.dd}"  # 날짜별로 인덱스 생성
  }
  
  # 디버깅용
  # stdout {
  #   codec => rubydebug
  # }
}
