version: '3.8'

services:
  # Elasticsearch - 로그 저장 및 검색 엔진
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.11.0
    container_name: elasticsearch
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false  # 간단한 학습용으로 보안 비활성화
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"  # 메모리 설정 (로컬 테스트용)
    ports:
      - "9200:9200"  # REST API
      - "9300:9300"  # 노드 간 통신
    volumes:
      - elasticsearch-data:/usr/share/elasticsearch/data
    networks:
      - elk

  # Kibana - 시각화 대시보드
  kibana:
    image: docker.elastic.co/kibana/kibana:8.11.0
    container_name: kibana
    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
    ports:
      - "5601:5601"
    depends_on:
      - elasticsearch
    networks:
      - elk

  # ES 초기화 - index template 자동 등록 후 종료
  es-setup:
    image: curlimages/curl:latest
    container_name: es-setup
    depends_on:
      - elasticsearch
    networks:
      - elk
    restart: "no"  # 한 번 실행 후 종료
    entrypoint:
      - sh
      - -c
      - |
        echo 'ES 준비 대기 중...' &&
        until curl -s http://elasticsearch:9200/_cluster/health > /dev/null; do
          sleep 2;
        done &&
        echo 'index template 등록 중...' &&
        curl -s -X PUT 'http://elasticsearch:9200/_index_template/logs-template' -H 'Content-Type: application/json' -d '{"index_patterns":["logs-*"],"template":{"settings":{"refresh_interval":"5s","number_of_shards":1,"number_of_replicas":0}},"priority":1}' &&
        echo 'template 등록 완료!'

  # Logstash - 로그 수집 및 변환
  logstash:
    image: docker.elastic.co/logstash/logstash:8.11.0
    container_name: logstash
    volumes:
      - ./logstash/pipeline:/usr/share/logstash/pipeline
      - ./logstash/config/logstash.yml:/usr/share/logstash/config/logstash.yml
    ports:
      - "5044:5044"  # Beats input
      - "9600:9600"  # Logstash monitoring API
    environment:
      - "LS_JAVA_OPTS=-Xms256m -Xmx256m"
    depends_on:
      - elasticsearch
    networks:
      - elk

volumes:
  elasticsearch-data:
    driver: local

networks:
  elk:
    driver: bridge
